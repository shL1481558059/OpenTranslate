name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Download OCR models
        run: node scripts/prepare-ocr-models.js

      - name: Download Node sidecar
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-node-sidecar.js

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('draft-{0}', github.run_id) }}
          releaseName: OpenTranslate ${{ github.ref_type == 'tag' && github.ref_name || format('draft-{0}', github.run_id) }}
          releaseBody: |
            OpenTranslate desktop installers.
            Each package bundles the Node translation API as a sidecar, the DeepL-compatible `/v2/translate` service, and the Linux OCR models. macOS uses Apple Vision and Windows uses Windows.Media.Ocr.
          releaseDraft: true
          args: ${{ matrix.args }}
