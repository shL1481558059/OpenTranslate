name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      tag_name: ${{ steps.create.outputs.tag_name }}
    steps:
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.slice('refs/tags/'.length)
              : `draft-${context.runId}`;
            core.setOutput('tag_name', tag);
            const { owner, repo } = context.repo;
            let existing = null;
            for (let page = 1; page <= 10; page += 1) {
              const { data } = await github.rest.repos.listReleases({
                owner,
                repo,
                per_page: 100,
                page,
              });
              existing = data.find((release) => release.tag_name === tag) || null;
              if (existing || data.length < 100) break;
            }
            if (existing) {
              core.info(`Reusing release ${existing.id} for ${tag}`);
              core.setOutput('release_id', String(existing.id));
              return;
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `OpenTranslate ${tag}`,
              body: [
                'OpenTranslate desktop installers.',
                'Each package embeds a DeepL-compatible `/v2/translate` service in the desktop process. macOS uses Apple Vision, Windows uses Windows.Media.Ocr, and Linux downloads PP-OCRv4 models on first OCR.',
              ].join('\n'),
              draft: true,
            });
            core.info(`Created draft release ${data.id} for ${tag}`);
            core.setOutput('release_id', String(data.id));

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # PipeWire 1.0 headers (Ubuntu 24.04). Ubuntu 22.04's 0.3 headers
          # do not match libspa 0.8, which xcap needs for screenshots.
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: OpenTranslate ${{ needs.create-release.outputs.tag_name }}
          releaseBody: |
            OpenTranslate desktop installers.
            Each package embeds a DeepL-compatible `/v2/translate` service in the desktop process. macOS uses Apple Vision, Windows uses Windows.Media.Ocr, and Linux downloads PP-OCRv4 models on first OCR.
          releaseDraft: true
          args: ${{ matrix.args }}
