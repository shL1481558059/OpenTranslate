<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手动翻译</title>
    <script src="./theme-bootstrap.js?v=2"></script>
    <script src="./tauri-bridge.js"></script>
    <link rel="stylesheet" href="./theme.css?v=6" />
    <link rel="stylesheet" href="./translate.css?v=6" />
  </head>
  <body>
    <div class="window-drag-region" aria-hidden="true"></div>
    <main class="app page-translate">
      <section class="shell">
        <header class="topbar">
          <div class="brand">
            <span class="mark" aria-hidden="true"></span>
            <div>
              <p class="kicker">OpenTranslate</p>
              <h1>手动翻译</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <button id="settingsBtn" class="button button-ghost" type="button">设置</button>
            <button id="copyBtn" class="button" type="button" disabled>复制结果</button>
            <button id="translateBtn" class="button button-primary" type="button">翻译</button>
          </div>
        </header>

        <p id="status" class="note" hidden></p>

        <section class="lang-row">
          <label class="field">
            <span>源语言</span>
            <select id="sourceLang"></select>
          </label>
          <label class="field">
            <span>目标语言</span>
            <select id="targetLang"></select>
          </label>
        </section>

        <section class="editors">
          <label class="editor">
            <span>原文</span>
            <textarea id="input" rows="12" placeholder="输入或粘贴要翻译的文本"></textarea>
          </label>
          <label class="editor">
            <span>译文</span>
            <textarea id="output" rows="12" readonly placeholder="译文会显示在这里"></textarea>
          </label>
        </section>
      </section>
    </main>
    <script type="module" src="./translate.js?v=7"></script>
  </body>
</html>
