<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Overlay</title>
    <script src="./theme-bootstrap.js?v=1"></script>
    <script src="./tauri-bridge.js"></script>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <img id="snapshot" alt="" />
    <div id="mask"></div>
    <div id="root"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="controls" role="toolbar" aria-label="浮层操作">
      <button id="extractSource" class="tool-btn" type="button" title="复制原文" aria-label="复制原文" hidden>
        <span data-role="label">原文</span>
      </button>
      <button id="extractTranslated" class="tool-btn" type="button" title="复制译文" aria-label="复制译文" hidden>
        <span data-role="label">译文</span>
      </button>
      <button id="close" class="tool-btn" type="button" title="关闭" aria-label="关闭">
        <span data-role="label">关闭</span>
      </button>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
